[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-sentiment-executive-intelligence"
version = "1.0.0"
description = "Privacy-safe survey document extraction, NLP scoring, and executive reporting demo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
azure = ["azure-ai-formrecognizer>=3.3,<4", "azure-ai-textanalytics>=5.3,<6"]
spark = ["pyspark>=3.5,<5", "delta-spark>=3.2"]
dev = ["pytest>=8"]

[project.scripts]
survey-intelligence = "survey_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
